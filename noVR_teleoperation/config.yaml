robot_ip: "localhost"
fake_only: true # Security to avoid sending command to a real robot if not wanted
tracker_type: "vive" # options: aruco, vive, rgbd, so_arm, gamepad
gripper_type: "potentiometer" # options: feetech, potentiometer
control_mode: "dual_arm" # options: , l_arm, r_arm
mirror_mode: false

## For RGBD
scale_percent: 50

## For Feetech grippers
feetech_ports:
  l_arm: "/dev/noVR_left_motor"
  r_arm: "/dev/noVR_right_motor"

feetech_gripper_joints_limit:
  l_arm: [65, 20]
  r_arm: [-65, -20]

potentiometer_gripper_joints_limit:
  l_arm: [450, 570]
  r_arm: [630, 790]

## For so Arm
port: "/dev/ttyACM0"

## For Arduino commands
arduino_ports:
  l_arm: "/dev/noVR_left_arduino"
  r_arm: "/dev/noVR_right_arduino"

## For VIVE
vive_trackers:
  l_arm: "LHR-0D914CCE"
  r_arm: "LHR-D520271F"

## For ARUCO
marker_size:
  l_arm: 0.053
  r_arm: 0.053

marker_ids:
  l_arm: [6, 7, 8, 9, 10, 11]
  r_arm: [0, 1, 2, 3, 4, 5] # back, up, front, left, right, down

camera:
  usb_mode: false
  camera_id: "172.16.0.56"
  with_calibration: false

  camera_matrix:
    - - 720.5567465155845
      - 0.0
      - 247.64108414499987
    - - 0.0
      - 714.4335786513287
      - 278.15541462350916
    - - 0.0
      - 0.0
      - 1.0
  dist_coeffs:
    -   - 0.008803296291899812
        - 0.46398897016824797
        - 0.02701695107028852
        - -0.0416190770556984
        - -0.6751017329030815


# For gamepad
angle_step: 2
z_increment: 0.002
x_y_joystick_ratio: 0.004
